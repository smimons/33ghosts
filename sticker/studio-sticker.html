<!--
  33ghosts cross-promo sticker -- plain HTML/CSS/SVG, no framework needed.
  Copy the <link> tags, the markup for whichever variant you want, and the
  <style> block into the target site. Update the two href="" values below
  if the studio ever moves off the surge.sh preview domain.

  This is a footer-level addendum, not a CTA -- it should read as a small,
  quiet credit line, not compete with the game's own buttons.

  Icon matches public/favicon.svg on the studio site -- keep them in sync.
  Note the overflow: visible on the <svg>s below: a favicon resource isn't
  clipped by the host page's CSS, but this same markup rendered inline in a
  page *is* clipped at the viewBox edge by default, and the glyph's real ink
  extends past it.
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Jost:wght@600;700&display=swap"
  rel="stylesheet"
/>

<!-- full variant: bordered icon cell + "33ghosts" / CTA subtitle -->
<a href="https://33ghosts.surge.sh" target="_blank" rel="noopener noreferrer" class="tg-sticker">
  <span class="tg-icon-cell">
    <svg width="26" height="26" viewBox="0 0 64 64" style="overflow: visible" aria-hidden="true" focusable="false">
      <text
        x="34.5"
        y="33"
        text-anchor="middle"
        dominant-baseline="central"
        font-family="Jost, 'Segoe UI', Arial, sans-serif"
        font-weight="700"
        font-size="56"
        fill="#c81e1e"
      >///:</text>
    </svg>
  </span>
  <span class="tg-sticker-text">
    <span class="tg-sticker-title">33ghosts</span>
    <span class="tg-sticker-cta">Play more games</span>
  </span>
</a>

<!-- mini variant: the bordered icon cell alone, for tight spaces -->
<a
  href="https://33ghosts.surge.sh"
  target="_blank"
  rel="noopener noreferrer"
  class="tg-sticker-mini"
  aria-label="More games from 33ghosts"
  title="More games from 33ghosts"
>
  <svg width="26" height="26" viewBox="0 0 64 64" style="overflow: visible" aria-hidden="true" focusable="false">
    <text
      x="34.5"
      y="33"
      text-anchor="middle"
      dominant-baseline="central"
      font-family="Jost, 'Segoe UI', Arial, sans-serif"
      font-weight="700"
      font-size="56"
      fill="#c81e1e"
    >///:</text>
  </svg>
</a>

<style>
  .tg-sticker,
  .tg-sticker-mini {
    display: inline-flex;
    text-decoration: none;
    color: inherit;
    font-family: 'Jost', 'Segoe UI', Arial, sans-serif;
    box-sizing: border-box;
    border: 2px solid #c81e1e;
    border-radius: 4px;
    transition: background-color 0.15s ease;
    width: fit-content;
  }
  .tg-sticker {
    align-items: stretch;
  }
  .tg-sticker:hover,
  .tg-sticker:focus-visible {
    background: rgba(200, 30, 30, 0.06);
  }
  .tg-icon-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    flex-shrink: 0;
  }
  .tg-sticker-text {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    padding: 4px 8px 4px 0px;
    min-width: 0;
  }
  .tg-sticker-title {
    font-weight: 700;
    font-size: 13px;
    line-height: 1.2;
    color: #131313;
    white-space: nowrap;
    text-transform: uppercase;
  }
  .tg-sticker-cta {
    font-weight: 500;
    font-size: 12px;
    line-height: 1.2;
    color: #6e6e6e;
    white-space: nowrap;
  }
  .tg-sticker-mini {
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
  }
  .tg-sticker-mini:hover,
  .tg-sticker-mini:focus-visible {
    background: rgba(200, 30, 30, 0.06);
  }
</style>
